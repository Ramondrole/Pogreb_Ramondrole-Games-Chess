<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>♛ Шахматы ♛</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <button id="backBtn" onclick="window.location.href='https://ramondrole.github.io/Pogreb_Ramondrole-Games/'">← НАЗАД</button>
            <div class="mode-selector">
                <button id="modeFriend" class="active">ДРУГ</button>
                <button id="modeBot">БОТ</button>
            </div>
        </div>
        <div class="board-container">
            <div id="chessboard" class="chessboard"></div>
        </div>
        <div class="status">
            <span id="turnIndicator">Ход белых</span>
            <span id="gameOverMsg"></span>
        </div>
        <div class="color-legend">
            <span class="blue">Синие</span> — белые (ходят первыми)   |   <span class="purple">Фиолетовые</span> — чёрные
        </div>
        <button id="newGameBtn">НОВАЯ ИГРА</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
